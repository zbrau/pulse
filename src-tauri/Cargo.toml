[package]
name = "pulse"
version = "0.2.3"
description = "Pulse — enfoque y música"
authors = ["brau"]
edition = "2021"

[lib]
name = "pulse_lib"
# Sólo rlib: el cdylib de la plantilla (para móvil) rompe MinGW con
# "export ordinal too large" y aquí no se usa.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.8"
futures-util = "0.3"
fs2 = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
