name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Windows installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        # `npm ci` falla si el lockfile se generó en otra plataforma: npm omite
        # las dependencias opcionales de wasm32 y luego las reclama al validar.
        run: npm install --no-audit --no-fund

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # En un tag, la release lleva el nombre del tag (`v0.2.0`). Si se lanza a
          # mano desde una rama, tauri-action sustituye __VERSION__.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Pulse v__VERSION__
          releaseBody: |
            Desktop app for focus and music: tasks, pomodoro, lofi radio and
            YouTube Music with synced lyrics, offline downloads and mini mode.

            The installer is not code-signed, so Windows SmartScreen may ask for
            confirmation the first time. Updates installed from inside the app are
            signed and verified against the project key.
          releaseDraft: false
          # Un tag con guion (`v0.3.0-rc1`) queda como prerelease y no se convierte
          # en la release "latest" que consulta el actualizador.
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
